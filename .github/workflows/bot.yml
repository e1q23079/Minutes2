name: Bot CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

  workflow_dispatch:

defaults:
  run:
    working-directory: ./services/bot

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check
