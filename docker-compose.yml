services:
  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    restart: always
    container_name: minutes-bot
    environment:
      - API_KEY=${API_KEY}
      - VOICE_CHANNEL_ID=${VOICE_CHANNEL_ID}
      - DATA_DIR=/data
      - TZ=Asia/Tokyo
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      ollama:
        condition: service_healthy

  controller:
    build:
      context: ./services/controller
      dockerfile: Dockerfile
    restart: always
    container_name: minutes-controller
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - DATA_DIR=/data
      - MODEL_SIZE=${MODEL_SIZE:-small}
      - OLLAMA_HOST=http://ollama:11434
      - TZ=Asia/Tokyo
    volumes:
      - ./data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      ollama:
        condition: service_healthy
      bot:
        condition: service_started

  ollama:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    restart: always
    container_name: minutes-llm
    environment:
      - TZ=Asia/Tokyo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
