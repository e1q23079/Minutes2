services:
  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    container_name: minutes-bot
    environment:
      - API_KEY=${API_KEY}
      - VOICE_CHANNEL_ID=${VOICE_CHANNEL_ID}
      - DATA_DIR=/data
      - TZ=Asia/Tokyo
    volumes:
      - ./services/data:/data
    depends_on:
      ollama:
        condition: service_healthy

  controller:
    build:
      context: ./services/controller
      dockerfile: Dockerfile
    container_name: minutes-controller
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - DATA_DIR=/data
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./services/data:/data
    depends_on:
      ollama:
        condition: service_healthy
      bot:
        condition: service_started

  ollama:
    build:
      context: ./services/llm
      dockerfile: Dockerfile
    container_name: minutes-llm
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10
