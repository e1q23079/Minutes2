services:
  bot:
    build:
      context: ./services/bot
      dockerfile: Dockerfile
    container_name: voxnote-bot
    environment:
      - API_KEY=${API_KEY}
      - VOICE_CHANNEL_ID=${VOICE_CHANNEL_ID}
      - DATA_DIR=/data
    volumes:
      - ./services/data:/data

  controller:
    build:
      context: ./services/controller
      dockerfile: Dockerfile
    container_name: voxnote-controller
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - DATA_DIR=/data
    volumes:
      - ./services/data:/data
